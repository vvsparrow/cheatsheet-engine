name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Quality Gate - Ruff Linting
        run: uv run ruff check .

      - name: Quality Gate - Ruff Formatting
        run: uv run ruff format --check .

      - name: Quality Gate - Pyright Strict
        run: uv run pyright

      - name: Quality Gate - Pytest Test Suite
        run: uv run pytest
