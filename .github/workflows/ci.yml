name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Quality Gate - Ruff Linting
        run: uv run ruff check .

      - name: Quality Gate - Ruff Formatting
        run: uv run ruff format --check .

      - name: Quality Gate - Pyright Strict
        run: uv run pyright

      - name: Quality Gate - Pytest Test Suite
        run: uv run pytest

  check-quality-gates:
    name: Quality Gates
    needs: quality-gates
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix runners passed
        run: |
          if [ "${{ needs.quality-gates.result }}" != "success" ]; then
            echo "One or more matrix runners failed"
            exit 1
          fi
